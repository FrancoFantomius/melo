<md-top-app-bar variant="small" id="main-top-app-bar" class="main-header">
  <div slot="navigation" class="header-brand-area">
    <md-icon-button id="btn-toggle-sidebar" icon="menu" aria-label="Toggle Sidebar" title="Toggle Sidebar"></md-icon-button>

    <a href="./index.html" data-view="home" class="logo-area" style="text-decoration: none;">
      <img src="./img/icons/icon.svg" alt="App Logo" class="app-logo">
      <span class="app-title">Melo</span>
    </a>
  </div>

  <div class="search-container">
    <md-search-bar
      id="global-search-bar"
      size="small"
      compact
      placeholder="Search artists, albums, tracks..."
      data-i18n-placeholder
    >
      <div slot="suggestions" id="search-dropdown-results" class="search-dropdown-results"></div>
    </md-search-bar>
  </div>

  <div slot="actions" class="header-actions">
    <!-- Theme Toggle Button -->
    <md-icon-button id="btn-theme-toggle" icon="brightness_auto" aria-label="Theme: Device default" title="Theme: Device default"></md-icon-button>

    <!-- Sign In Button (Logged Out state) -->
    <md-button id="btn-sync-login" variant="filled">
      <span data-i18n>Sign in</span>
    </md-button>

    <!-- Account Menu (Logged In state) -->
    <md-account-menu
      id="header-account-menu"
      name="Jellyfin User"
      email="http://server.example.com"
      headline="Account"
      manage-text="Settings"
      show-tabs="false"
      alignment="end"
      pivot="right"
      style="display: none;"
    >
      <div slot="overview"></div>
      <div slot="footer" class="account-menu-custom-footer">
        <button type="button" id="btn-account-signout" class="account-signout-btn">
          <md-icon name="logout"></md-icon>
          <span data-i18n>Sign out</span>
        </button>
        <div class="account-footer-links">
          <a id="btn-dropdown-terms" href="./terms.html" data-i18n>Terms of Service</a>
          <span class="footer-dot">&bull;</span>
          <a id="btn-dropdown-privacy" href="./privacy.html" data-i18n>Privacy Policy</a>
        </div>
      </div>
    </md-account-menu>
  </div>
</md-top-app-bar>
