<footer class="main-player">
  <div class="player-left">
    <img id="player-track-cover" src="./img/song.svg" onerror="this.onerror=null; this.src=window.getPlaceholder ? window.getPlaceholder('song') : './img/song.svg';" data-placeholder-type="song" class="player-cover" alt="Cover">
    <div class="player-track-details">
      <div id="player-track-title" class="player-track-title"><span class="title-marquee-inner">No track selected</span></div>
      <div id="player-track-artist" class="player-track-artist">Select a song to start playing</div>
    </div>
    <md-icon-button id="player-btn-like" class="btn-like" variant="standard" icon="favorite_border" aria-label="Like" tooltip-position="top" style="display: none; margin-left: 4px;"></md-icon-button>
    <md-icon-button id="player-btn-add-playlist" variant="standard" icon="playlist_add" aria-label="Add to Playlist" tooltip-position="top" style="display: none; margin-left: 4px;"></md-icon-button>
    <md-icon-button id="player-btn-download" class="btn-download" variant="standard" icon="download" aria-label="Download" tooltip-position="top" style="display: none; margin-left: 4px;"></md-icon-button>
  </div>

  <div class="player-center">
    <div class="player-controls">
      <md-icon-button id="player-btn-shuffle" class="player-icon-btn" variant="standard" icon="shuffle" aria-label="Shuffle" tooltip-position="top"></md-icon-button>
      <md-icon-button id="player-btn-skip-back" class="btn-skip" variant="standard" icon="replay_10" aria-label="Rewind 10 seconds" tooltip-position="top" style="display: none;"></md-icon-button>
      <md-icon-button id="player-btn-prev" class="player-icon-btn" variant="standard" icon="skip_previous" aria-label="Previous Track" tooltip-position="top"></md-icon-button>
      <md-icon-button id="player-btn-play" class="player-play-btn" variant="standard" icon="play_circle" aria-label="Play" tooltip-position="top"></md-icon-button>
      <md-icon-button id="player-btn-next" class="player-icon-btn" variant="standard" icon="skip_next" aria-label="Next Track" tooltip-position="top"></md-icon-button>
      <md-icon-button id="player-btn-skip-forward" class="btn-skip" variant="standard" icon="forward_30" aria-label="Fast-forward 30 seconds" tooltip-position="top" style="display: none;"></md-icon-button>
      <md-icon-button id="player-btn-repeat" class="player-icon-btn" variant="standard" icon="repeat" aria-label="Repeat" tooltip-position="top"></md-icon-button>
    </div>

    <div class="player-progress-area">
      <span id="player-current-time" class="time-stamp">0:00</span>
      <div class="timeline-container" id="player-timeline-container">
        <div class="timeline-track-bg"></div>
        <div class="timeline-track-fill timeline-bar"></div>
        <div class="timeline-track-fill timeline-wave"></div>
        <input type="range" id="player-progress" class="timeline-slider" min="0" max="100" step="any" value="0" aria-label="Playback timeline">
      </div>
      <span id="player-total-time" class="time-stamp">0:00</span>
    </div>
  </div>

  <div class="player-right">
    <md-button id="player-speed-badge" class="player-speed-badge" variant="tonal" aria-label="Playback Speed" tooltip-position="top" style="display: none;">1.0x</md-button>
    <md-button id="player-quality-badge" class="quality-badge" variant="tonal" aria-label="Click to toggle quality / force transcode" tooltip-position="top">DIRECT</md-button>
    <md-icon-button id="player-btn-lyrics" variant="standard" icon="lyrics" aria-label="Lyrics" tooltip-position="top" style="display: none;"></md-icon-button>
    <md-icon-button id="player-btn-queue" variant="standard" icon="queue_music" aria-label="Queue" tooltip-position="top"></md-icon-button>
    <md-icon-button id="player-btn-volume" variant="standard" icon="volume_up" aria-label="Mute" tooltip-position="top"></md-icon-button>
    <input type="range" id="player-volume" min="0" max="1" step="0.01" value="0.8" style="width: 80px;" aria-label="Volume">
  </div>
</footer>

<!-- Full Page Player Overlay (Desktop & Mobile) -->
<div id="expanded-mobile-player" class="expanded-player expanded-mobile-player" role="dialog" aria-modal="true" aria-label="Full-Screen Player">
  <!-- Top Bar with Close/Minimize Chevron -->
  <div class="emp-top-bar">
    <md-icon-button id="emp-btn-close" class="emp-close-btn" variant="standard" icon="expand_more" aria-label="Minimize Player" tooltip-position="bottom"></md-icon-button>
    <div class="emp-top-title" data-i18n>Now Playing</div>
    <div class="emp-top-actions">
      <md-button id="emp-quality-badge" class="quality-badge emp-quality-badge" variant="tonal" aria-label="Click to toggle quality / force transcode" tooltip-position="bottom">DIRECT</md-button>
    </div>
  </div>

  <!-- Main Body Content Wrapper -->
  <div class="emp-body-wrapper">
    <!-- Left / Top: Song Cover Image -->
    <div class="emp-cover-container">
      <img id="emp-cover" src="./img/song.svg" onerror="this.onerror=null; this.src=window.getPlaceholder ? window.getPlaceholder('song') : './img/song.svg';" data-placeholder-type="song" class="emp-cover-img" alt="Cover">
    </div>

    <!-- Right / Middle: Song Details, Progress & Controls -->
    <div class="emp-main-content">
      <div class="emp-header-actions-row">
        <div class="emp-track-details">
          <div id="emp-title" class="emp-track-title"><span class="title-marquee-inner">No track selected</span></div>
          <div id="emp-artist" class="emp-track-artist">Select a song to start playing</div>
        </div>

        <!-- Secondary Action Icons (Like, Add to Playlist, Download, Queue, Lyrics, Speed) -->
        <div class="emp-secondary-actions">
          <md-icon-button id="emp-btn-like" class="btn-like" variant="standard" icon="favorite_border" aria-label="Like" tooltip-position="top"></md-icon-button>
          <md-icon-button id="emp-btn-add-playlist" variant="standard" icon="playlist_add" aria-label="Add to Playlist" tooltip-position="top" style="display: none;"></md-icon-button>
          <md-icon-button id="emp-btn-download" class="btn-download" variant="standard" icon="download" aria-label="Download" tooltip-position="top" style="display: none;"></md-icon-button>
          <md-icon-button id="emp-btn-queue" variant="standard" icon="queue_music" aria-label="Queue" tooltip-position="top"></md-icon-button>
          <md-icon-button id="emp-btn-lyrics" variant="standard" icon="lyrics" aria-label="Lyrics" tooltip-position="top" style="display: none;"></md-icon-button>
          <md-button id="emp-speed-badge" class="player-speed-badge emp-speed-badge" variant="tonal" aria-label="Playback Speed" tooltip-position="top" style="display: none;">1.0x</md-button>
        </div>
      </div>

      <!-- Timebar / Progress Slider -->
      <div class="emp-progress-area">
        <div class="timeline-container" id="emp-timeline-container">
          <div class="timeline-track-bg"></div>
          <div class="timeline-track-fill timeline-bar"></div>
          <div class="timeline-track-fill timeline-wave"></div>
          <input type="range" id="emp-progress" class="timeline-slider" min="0" max="100" step="any" value="0" aria-label="Playback timeline">
        </div>
        <div class="emp-timestamps">
          <span id="emp-current-time" class="time-stamp">0:00</span>
          <span id="emp-total-time" class="time-stamp">0:00</span>
        </div>
      </div>

      <!-- Primary Playback Controls -->
      <div class="emp-controls">
        <md-icon-button id="emp-btn-shuffle" class="emp-icon-btn" variant="standard" icon="shuffle" aria-label="Shuffle" tooltip-position="top"></md-icon-button>
        <md-icon-button id="emp-btn-skip-back" class="emp-icon-btn btn-skip" variant="standard" icon="replay_10" aria-label="Rewind 10 seconds" tooltip-position="top" style="display: none;"></md-icon-button>
        <md-icon-button id="emp-btn-prev" class="emp-icon-btn" variant="standard" icon="skip_previous" aria-label="Previous Track" tooltip-position="top"></md-icon-button>
        <md-icon-button id="emp-btn-play" class="emp-play-btn" variant="standard" icon="play_circle" aria-label="Play" tooltip-position="top"></md-icon-button>
        <md-icon-button id="emp-btn-next" class="emp-icon-btn" variant="standard" icon="skip_next" aria-label="Next Track" tooltip-position="top"></md-icon-button>
        <md-icon-button id="emp-btn-skip-forward" class="emp-icon-btn btn-skip" variant="standard" icon="forward_30" aria-label="Fast-forward 30 seconds" tooltip-position="top" style="display: none;"></md-icon-button>
        <md-icon-button id="emp-btn-repeat" class="emp-icon-btn" variant="standard" icon="repeat" aria-label="Repeat" tooltip-position="top"></md-icon-button>
      </div>

      <!-- Extra Controls: Volume -->
      <div class="emp-extra-controls">
        <div class="emp-volume-group">
          <md-icon-button id="emp-btn-volume" class="emp-icon-btn" variant="standard" icon="volume_up" aria-label="Mute" tooltip-position="top"></md-icon-button>
          <input type="range" id="emp-volume" min="0" max="1" step="0.01" value="0.8" class="emp-volume-slider" aria-label="Volume">
        </div>
      </div>
    </div>
  </div>
</div>
